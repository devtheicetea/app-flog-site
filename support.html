<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Flog</title>
  <meta name="description" content="Support and contact for Flog, the film photography logbook for iPhone." />
  <link rel="canonical" href="https://flog.contraststudio.app/support.html" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b0d;
      --surface: #161419;
      --border: rgba(236, 231, 221, 0.12);
      --text-primary: #ece7dd;
      --text-secondary: #a39d92;
      --text-tertiary: #6f6a62;
      --accent: #e07a3e;
      --serif: 'Fraunces', Georgia, serif;
      --mono: 'Space Mono', monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      padding: 0 24px;
    }

    .page-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 0 120px;
    }

    header {
      margin-bottom: 64px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }

    .app-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    section { margin-bottom: 48px; }

    p {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      font-weight: 300;
    }

    p:last-child { margin-bottom: 0; }

    strong {
      font-weight: 500;
      color: var(--text-primary);
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(224, 122, 62, 0.4);
      transition: text-decoration-color 0.15s;
    }

    a:hover { text-decoration-color: var(--text-primary); }

    .email {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text-primary);
      text-decoration-color: var(--text-tertiary);
    }

    footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer span {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
    }

    footer a {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
      text-decoration-color: var(--border);
    }
  </style>
</head>
<body>
  <div class="page-wrap">

    <header>
      <p class="app-label">Flog</p>
      <h1>Support</h1>
    </header>

    <section>
      <p>Need help with Flog? Have a question, a bug report, or feature feedback? We'd love to hear from you.</p>
      <p>Email us at <a class="email" href="mailto:contact@contraststudio.app">contact@contraststudio.app</a> and we'll get back to you as soon as we can.</p>
    </section>

    <footer>
      <span>© 2026 Contrast Studio LLC</span>
      <span>
        <a href="privacy.html">Privacy Policy</a>
        &nbsp;·&nbsp;
        <a href="terms.html">Terms of Use</a>
      </span>
    </footer>

  </div>
</body>
</html>
